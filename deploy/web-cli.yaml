apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-cli-file
  labels:
    app: web-cli-file
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-cli-file
  template:
    metadata:
      labels:
        app: web-cli-file
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

