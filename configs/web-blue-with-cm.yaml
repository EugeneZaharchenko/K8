apiVersion: apps/v1
kind: Deployment
metadata:
  name: blue-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blue-web
  template:
    metadata:
      labels:
        app: blue-web
    spec:
      containers:
        - name: nginx
          image: nginx
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: blue-web-cm
            items:
              - key: index_blue.html
                path: index.html  # 🔥 Перейменування до потрібного імені!
